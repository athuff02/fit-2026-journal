<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vision 2026 Mindset Journal</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fit 2026 Journal">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
  <script src="app.js" defer></script>
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen">
<a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-white focus:text-gray-900 focus:shadow-lg focus:rounded focus:outline-none focus:ring-2 focus:ring-gray-900">
  Skip to content
</a>
<div class="max-w-md mx-auto p-4">

  <!-- Header -->
  <header class="text-center mb-6 relative">
    <button id="settingsBtn" title="Settings" class="absolute top-0 right-0 p-2 text-gray-600 hover:text-gray-900 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2 rounded-full" aria-label="Settings">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </button>
    <h1 class="text-xl font-semibold">Vision 2026 Mindset Journal</h1>
    <p id="dateDisplay" class="text-sm text-gray-700 mt-1"></p>
    <p id="themeDisplay" class="text-lg font-medium mt-2"></p>
    <p id="streakDisplay" class="text-sm text-gray-700 mt-1"></p>
    <button id="scriptureDisplay" class="text-sm text-gray-700 mt-1 italic hover:text-gray-900 focus:outline-none focus:bg-gray-100 focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2 rounded px-2 py-1 transition-colors cursor-pointer" title="Click to copy" aria-label="Copy scripture to clipboard"></button>

  </header>

  <!-- Tabs -->
  <nav class="flex justify-center gap-4 mb-6" role="tablist" aria-label="Journal Sections">
    <button id="dailyTab" role="tab" aria-selected="true" aria-controls="dailyView" tabindex="0" class="border-b-2 border-gray-900 pb-1 text-sm font-medium focus:outline-none focus:bg-gray-100 focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2 rounded-t px-2 transition-colors">
      Daily Focus
    </button>
    <button id="historyTab" role="tab" aria-selected="false" aria-controls="historyView" tabindex="-1" class="pb-1 text-sm font-medium text-gray-600 focus:outline-none focus:bg-gray-100 focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2 rounded-t px-2 transition-colors">
      History
    </button>
  </nav>

  <!-- LIVE REGION -->
  <div id="a11y-announcer" class="sr-only" aria-live="polite"></div>

  <main id="main-content" tabindex="-1">
    <!-- DAILY VIEW -->
    <section id="dailyView" role="tabpanel" aria-labelledby="dailyTab" tabindex="0">
      <h2 class="sr-only">Daily Focus Entry Form</h2>
    <form id="journalForm" class="space-y-4">

        <label for="q1" class="block text-sm font-medium text-gray-700 mb-1">1. Why does this part of my life matter?</label>
        <textarea id="q1" class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-shadow" rows="3" data-question="q1"></textarea>

        <label for="q2" class="block text-sm font-medium text-gray-700 mb-1">2. Where do I want to be as far as this theme?</label>
        <textarea id="q2" class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-shadow" rows="3" data-question="q2"></textarea>

        <label for="q3" class="block text-sm font-medium text-gray-700 mb-1">3. What might I be doing if I cared about this more?</label>
        <textarea id="q3" class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-shadow" rows="3" data-question="q3"></textarea>

        <label for="q4" class="block text-sm font-medium text-gray-700 mb-1">4. What is one small improvement I can make?</label>
        <textarea id="q4" class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-shadow" rows="3" data-question="q4"></textarea>

        <label for="q5" class="block text-sm font-medium text-gray-700 mb-1">5. What resistance do I need to overcome?</label>
        <textarea id="q5" class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-shadow" rows="3" data-question="q5"></textarea>

      <label for="actionItem" class="block text-sm font-medium text-gray-700 mb-1">Action Item</label>
      <input id="actionItem" type="text" class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-shadow" />

      <p class="text-sm text-gray-700 italic text-center">
        Now, pray God will bless your efforts in this area.
      </p>

      <button id="saveBtn" type="submit" aria-keyshortcuts="Control+Enter" title="Save Entry (Ctrl + Enter)" class="bg-gray-900 text-white py-3 rounded w-full text-sm font-medium focus:outline-none focus-visible:ring-2 focus:ring-gray-900 focus:ring-offset-2 disabled:opacity-70 disabled:cursor-wait">
        Save Entry
        <span class="hidden sm:inline opacity-75 font-normal ml-1" aria-hidden="true">(Ctrl + Enter)</span>
      </button>

      <button type="button" id="calendarBtn" class="border border-gray-900 py-3 rounded w-full text-sm font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2">
        Add Action Item to Calendar
      </button>

    </form>
  </section>

  <!-- HISTORY VIEW -->
  <section id="historyView" class="hidden" role="tabpanel" aria-labelledby="historyTab" tabindex="0">
    <h2 class="sr-only">Journal History and Statistics</h2>
    <div id="statsContainer" class="mb-4 space-y-4"></div>
    <select id="themeFilter" aria-label="Filter history by theme" class="w-full p-2 border rounded mb-4 text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-shadow">
      <option value="all">All Themes</option>
    </select>

    <div id="historyList" class="space-y-4"></div>

    <button id="exportAllBtn" class="border border-gray-900 py-3 rounded w-full text-sm font-medium mt-4 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2">
      Export All to CSV
    </button>
  </section>
  </main>

</div>

<!-- MODAL -->
<div id="modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="bg-white rounded p-4 max-w-md w-full space-y-3">
    <div id="modalContent"></div>
    <div class="flex gap-2">
      <button id="exportBtn" class="border px-3 py-2 rounded text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2">Export .txt</button>
      <button id="deleteBtn" class="hidden text-red-600 border border-red-600 px-3 py-2 rounded text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-red-600 focus-visible:ring-offset-2 hover:bg-red-50 ml-2">Delete</button>
      <button onclick="closeModal()" id="closeModalBtn" class="ml-auto text-sm text-gray-700 rounded px-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2">Close</button>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="bg-white rounded p-4 max-w-sm w-full space-y-4 shadow-lg">
    <h2 id="settingsTitle" class="text-lg font-semibold text-gray-900">Notification Settings</h2>

    <div class="space-y-4">
      <div class="flex items-center justify-between">
        <label for="enableNotifications" class="text-sm font-medium text-gray-700">Daily Reminder</label>
        <input type="checkbox" id="enableNotifications" class="h-5 w-5 accent-gray-900 border-gray-300 rounded focus:ring-gray-900">
      </div>

      <div id="timeSettings" class="hidden space-y-2">
        <label for="notificationTime" class="block text-sm font-medium text-gray-700">Reminder Time</label>
        <input type="time" id="notificationTime" class="w-full p-2 border border-gray-300 rounded focus:ring-gray-900 focus:border-gray-900">
        <p class="text-xs text-gray-600">
          Note: Notifications will only appear if this tab is open or the browser is running.
        </p>
      </div>
    </div>

    <div class="flex justify-end gap-2 pt-2">
      <button id="cancelSettingsBtn" class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-900 transition-colors">Cancel</button>
      <button id="saveSettingsBtn" class="px-4 py-2 text-sm font-medium text-white bg-gray-900 hover:bg-gray-800 rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-gray-900 transition-colors">Save</button>
    </div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-max max-w-sm"></div>

</body>
</html>
